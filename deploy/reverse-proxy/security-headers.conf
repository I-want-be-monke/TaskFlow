# Stage 9 edge contract. Apply these headers at the TLS-terminating ingress/reverse proxy.
# Do not expose /health/* publicly; keep probes on the internal platform network.
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
