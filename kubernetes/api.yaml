apiVersion: v1
kind: Service
metadata:
  name: taskflow-api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-api
    app.kubernetes.io/part-of: taskflow
spec:
  selector:
    app.kubernetes.io/name: taskflow-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-api
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-api
        app.kubernetes.io/part-of: taskflow
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: taskflow-api:dz3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: TASKFLOW_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-credentials
                  key: app-db-password
            - name: ConnectionStrings__Postgres
              value: Host=taskflow-postgres;Port=5432;Database=taskflow;Username=taskflow_app;Password=$(TASKFLOW_APP_DB_PASSWORD);SSL Mode=Disable
            - name: Auth__AllowRegistration
              value: "true"
            - name: Security__RateLimit__ApiPermitLimit
              value: "100"
            - name: Security__RateLimit__LoginPermitLimit
              value: "10"
            - name: Security__RateLimit__WindowSeconds
              value: "60"
            - name: Security__RequestTimeoutSeconds
              value: "30"
            - name: Security__MaxRequestBodyBytes
              value: "1048576"
            - name: Proxy__ForwardLimit
              value: "1"
            - name: Proxy__KnownNetworks__0
              value: 10.244.0.0/16
            - name: Observability__ServiceVersion
              value: dz3
            - name: Observability__SlowDbThresholdMs
              value: "500"
            - name: Logging__LogLevel__Default
              value: Information
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            # /health/ready deliberately requires authentication in TaskFlow.
            # A TCP check proves that the API process accepts connections
            # without exposing a new unauthenticated readiness endpoint.
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
