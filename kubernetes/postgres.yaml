apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-postgres-init
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-postgres
data:
  10-create-roles.sh: |
    #!/bin/sh
    set -eu
    : "${TASKFLOW_APP_DB_PASSWORD:?TASKFLOW_APP_DB_PASSWORD is required}"
    : "${TASKFLOW_MIGRATOR_DB_PASSWORD:?TASKFLOW_MIGRATOR_DB_PASSWORD is required}"
    psql --set=ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set=app_password="$TASKFLOW_APP_DB_PASSWORD" \
      --set=migrator_password="$TASKFLOW_MIGRATOR_DB_PASSWORD" <<'SQL'
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'taskflow_app') THEN
            CREATE ROLE taskflow_app LOGIN;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'taskflow_migrator') THEN
            CREATE ROLE taskflow_migrator LOGIN;
        END IF;
    END
    $$;
    ALTER ROLE taskflow_app WITH LOGIN PASSWORD :'app_password';
    ALTER ROLE taskflow_migrator WITH LOGIN PASSWORD :'migrator_password';
    SQL
  20-least-privilege.sql: |
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    GRANT USAGE ON SCHEMA public TO taskflow_app;
    GRANT USAGE, CREATE ON SCHEMA public TO taskflow_migrator;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO taskflow_app;
    GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO taskflow_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE taskflow_migrator IN SCHEMA public
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO taskflow_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE taskflow_migrator IN SCHEMA public
      GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO taskflow_app;
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-postgres
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-postgres
    app.kubernetes.io/part-of: taskflow
spec:
  # Governing Service for the StatefulSet. With one replica it also remains
  # the stable in-cluster address used by the API and the migration Job.
  clusterIP: None
  selector:
    app.kubernetes.io/name: taskflow-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: taskflow-postgres
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-postgres
    app.kubernetes.io/part-of: taskflow
spec:
  serviceName: taskflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-postgres
        app.kubernetes.io/part-of: taskflow
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6-alpine3.24
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: taskflow
            - name: POSTGRES_USER
              value: taskflow_bootstrap
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-credentials
                  key: postgres-superuser-password
            - name: TASKFLOW_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-credentials
                  key: app-db-password
            - name: TASKFLOW_MIGRATOR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-credentials
                  key: migrator-db-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/10-create-roles.sh
              subPath: 10-create-roles.sh
              readOnly: true
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/20-least-privilege.sql
              subPath: 20-least-privilege.sql
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready --username taskflow_bootstrap --dbname taskflow"]
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready --username taskflow_bootstrap --dbname taskflow"]
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready --username taskflow_bootstrap --dbname taskflow"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-init
          configMap:
            name: taskflow-postgres-init
            defaultMode: 493
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: taskflow
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
