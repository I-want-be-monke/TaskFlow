apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-frontend-nginx
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-frontend
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        access_log off;
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location / { return 308 https://$host:8443$request_uri; }
    }
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /tmp/taskflow-tls.crt;
        ssl_certificate_key /tmp/taskflow-tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;
        include /etc/nginx/snippets/taskflow-security-headers.conf;
        gzip_static on;
        location ^~ /health/ { return 404; }
        location /api/ {
            proxy_pass http://taskflow-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;
        }
        location = /index.html {
            include /etc/nginx/snippets/taskflow-security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
        location ~ "^/_framework/.+\.[A-Za-z0-9]{10}\.[A-Za-z0-9.]+(?:\.gz)?$" {
            include /etc/nginx/snippets/taskflow-security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        location /_framework/ {
            include /etc/nginx/snippets/taskflow-security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-frontend
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-frontend
    app.kubernetes.io/part-of: taskflow
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: taskflow-frontend
  ports:
    - name: https
      port: 8443
      targetPort: https
      nodePort: 30443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-frontend
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-frontend
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-frontend
        app.kubernetes.io/part-of: taskflow
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: taskflow-frontend:dz2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: taskflow-frontend-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
