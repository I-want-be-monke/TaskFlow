# Учебные пароли для локального minikube. Перед публикацией замените их
# значениями из безопасного хранилища секретов.
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-db-credentials
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
type: Opaque
stringData:
  postgres-superuser-password: taskflow-local-bootstrap
  app-db-password: taskflow-local-app
  migrator-db-password: taskflow-local-migrator
