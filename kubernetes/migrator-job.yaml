apiVersion: batch/v1
kind: Job
metadata:
  name: taskflow-migrator
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-migrator
    app.kubernetes.io/part-of: taskflow
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-migrator
        app.kubernetes.io/part-of: taskflow
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:18.6-alpine3.24
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h taskflow-postgres -U taskflow_bootstrap -d taskflow; do echo Waiting for PostgreSQL; sleep 2; done"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: migrator
          image: taskflow-migrator:dz2
          imagePullPolicy: IfNotPresent
          env:
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: TASKFLOW_MIGRATOR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-credentials
                  key: migrator-db-password
            - name: Migrator__LockTimeoutSeconds
              value: "30"
            - name: Observability__ServiceVersion
              value: dz2
          command: ["sh", "-c", "export ConnectionStrings__Postgres=\"Host=taskflow-postgres;Port=5432;Database=taskflow;Username=taskflow_migrator;Password=${TASKFLOW_MIGRATOR_DB_PASSWORD};SSL Mode=Disable\"; exec dotnet TaskFlow.DbMigrator.dll"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
