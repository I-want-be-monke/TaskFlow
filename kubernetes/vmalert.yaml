apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-vmalert-rules
  namespace: taskflow
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: taskflow-observability
data:
  taskflow-logs.yaml: |
    groups:
      - name: taskflow-logs
        type: vlogs
        interval: 1m
        rules:
          - alert: TaskFlowExcessiveWarnings
            expr: 'service.name:TaskFlow.Api level:Warning | stats by (service.name) count() as warnings | filter warnings:>3'
            labels:
              severity: warning
              component: taskflow-api
            annotations:
              summary: 'TaskFlow API emitted more than 3 warning logs in one minute'
              description: 'Victoria Logs counted {{ $value }} warning records for {{ index $labels "service.name" }} during the last minute.'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-alertmanager-config
  namespace: taskflow
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: taskflow-observability
data:
  alertmanager.yml: |
    route:
      receiver: discard
    receivers:
      - name: discard
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-alertmanager
  namespace: taskflow
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: taskflow-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-alertmanager
  namespace: taskflow
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: taskflow-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: taskflow-observability
    spec:
      automountServiceAccountToken: false
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.34.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: taskflow-alertmanager-config
        - name: data
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-vmalert
  namespace: taskflow
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: taskflow-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-vmalert
  namespace: taskflow
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: taskflow-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
        app.kubernetes.io/part-of: taskflow-observability
    spec:
      automountServiceAccountToken: false
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.154.0
          imagePullPolicy: IfNotPresent
          args:
            - -rule=/etc/vmalert/taskflow-logs.yaml
            - -rule.defaultRuleType=vlogs
            - -datasource.url=http://victoria-logs.taskflow.svc.cluster.local:9428
            - -notifier.url=http://taskflow-alertmanager.taskflow.svc.cluster.local:9093
            - -rule.evalDelay=5s
          ports:
            - name: http
              containerPort: 8880
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: taskflow-vmalert-rules
