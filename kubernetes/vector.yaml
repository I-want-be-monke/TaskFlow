apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskflow-vector
  namespace: taskflow
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: taskflow-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: taskflow-vector-log-reader
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: taskflow-observability
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: taskflow-vector-log-reader
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: taskflow-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: taskflow-vector-log-reader
subjects:
  - kind: ServiceAccount
    name: taskflow-vector
    namespace: taskflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-vector-config
  namespace: taskflow
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: taskflow-observability
data:
  vector.yaml: |
    data_dir: /vector-data

    sources:
      kubernetes_logs:
        type: kubernetes_logs

    transforms:
      taskflow_api_only:
        type: filter
        inputs:
          - kubernetes_logs
        condition: .kubernetes.pod_namespace == "taskflow" && .kubernetes.container_name == "api"
      parse_taskflow_json:
        type: remap
        inputs:
          - taskflow_api_only
        source: |
          parsed = parse_json!(.message)
          pod_name = .kubernetes.pod_name
          pod_namespace = .kubernetes.pod_namespace
          . = parsed
          .kubernetes.pod_name = pod_name
          .kubernetes.pod_namespace = pod_namespace
          .kubernetes.container_name = "api"

    sinks:
      victoria_logs:
        type: elasticsearch
        inputs:
          - parse_taskflow_json
        endpoints:
          - http://victoria-logs.taskflow.svc.cluster.local:9428/insert/elasticsearch/
        mode: bulk
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: service.name,service.instance.id
          ignore_fields: file,source_type
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: taskflow-vector
  namespace: taskflow
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: taskflow-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/part-of: taskflow-observability
      annotations:
        vector.dev/exclude-containers: vector
    spec:
      serviceAccountName: taskflow-vector
      terminationGracePeriodSeconds: 30
      containers:
        - name: vector
          image: timberio/vector:0.59.0-alpine
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/vector/vector.yaml
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: var-log-pods
              mountPath: /var/log/pods
              readOnly: true
            - name: data
              mountPath: /vector-data
      volumes:
        - name: config
          configMap:
            name: taskflow-vector-config
        - name: var-log-pods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/taskflow-vector
            type: DirectoryOrCreate
